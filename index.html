<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    font-family:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;
    padding:24px;
  }

  .headline{
    font-size:clamp(28px,7vw,72px);
    font-weight:600;
    letter-spacing:-.02em;
    line-height:1.1;
    text-align:center;

    background-image:linear-gradient(90deg,
      #ffffff,#8ab4ff,#c58bff,#ff9ecb,#ffd59e,#ffffff);
    background-size:300% 100%;
    background-position:0% center;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }

  .dots b{font-weight:600}

  /* Respect reduced motion preferences */
  @media (prefers-reduced-motion: reduce) {
    .headline { background-position: 50% center !important; }
  }
</style>

<!-- Structured data (Organization + geo targeting for Prague, Czechia) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Prague Robotics",
  "url": "https://prague2030.github.io/prlanding/",
  "description": "Prague-based robotics startup focused on 3D printing custom robots: humanoids, rovers and robotic arms.",
  "keywords": "Prague robots, Czechia robotics, robot printing, 3D printed robot, humanoids, rovers, robotic arms",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Prague",

  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": 50.0755,
    "longitude": 14.4378
  }
}
</script>

</head>
<body>
  <h1 class="headline" id="h">The printing of your robot will be completed shortly.<span class="dots"><b>.</b><b>.</b><b>.</b></span></h1>

  <script>
    const h = document.getElementById('h');

    // gradient flow (JS-driven, always runs)
    let pos = 0;
    function flow(){
      pos = (pos + 0.35) % 300;
      h.style.backgroundPosition = pos + '% center';
      requestAnimationFrame(flow);
    }
    requestAnimationFrame(flow);

    // blinking dots (safe if nodes missing)
    const dots = h.querySelectorAll('.dots b');
    if (dots.length > 0) {
      let t = 0;
      setInterval(() => {
        dots.forEach((d,i) => d.style.opacity = (i === t % 3) ? '1' : '0.15');
        t++;
      }, 300);
    }
  </script>
</body>
